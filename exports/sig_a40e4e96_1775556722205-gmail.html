<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Gmail — Sophie Laurent</title>
<style>
  body { margin: 0; padding: 0; background: #fff; font-family: Arial, sans-serif; }
  .sig-container { max-width: 600px; background: #0d0d1a; border-radius: 8px; overflow: hidden; }
  .sig-svg { display: block; width: 100%; }
  @media (prefers-color-scheme: light) {
    .sig-container { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  }
  @media only screen and (max-width: 480px) {
    .sig-container { width: 100% !important; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="sig-container">
  <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="180" viewBox="0 0 600 180"
     role="img" aria-label="Email Signature">
  <title>Email Signature</title>

  <defs>
    <!-- Gradient definitions for all variations -->
    <linearGradient id="grad-bg-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-bg-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f0e6c8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="grad-shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="grad-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-sep-flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="40%" stop-color="#c9a84c" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f0e6c8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f0e6c8" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* =============================================
         EFFECTFORGE AI — Living Email Signature SVG
         Cycle: 240s total | 4 Variations | Pure CSS
         No JavaScript | Email-compatible
         ============================================= */

      /* Timing custom properties */
      :root {
        --cycle: 80s;
        --fade-dur: 2s;
        --mouse-x: 0.5;
        --mouse-y: 0.5;
        --energy: 1;
      }

      /* Smooth cross-fade transitions between variations — cubic-bezier */
      .var-layer-enter { animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      .var-layer-exit  { animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      /* Micro-parallax réactif à la souris via CSS custom properties */
      #layer-var-a, #layer-var-b, #layer-var-c, #layer-var-d {
        transform-origin: center;
        transition: filter 0.8s ease;
      }


      /* === VARIATION A: Breathing Particles === */
      @keyframes breathe-bg-a {
        0%, 100% { opacity: 0; }
        10% { opacity: 0.52; }
        90% { opacity: 0.52; }
      }
      @keyframes float-pA {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0; }
        10% { opacity: 0.65; }
        50% { transform: translateY(-18px) translateX(8px); opacity: 0.65; }
        90% { opacity: 0; }
      }
      @keyframes pulse-photo-a {
        0%, 100% { opacity: 0; }
        20% { opacity: 0.325; }
        80% { opacity: 0.325; }
      }
      @keyframes shimmer-name-a {
        0%, 100% { opacity: 0; }
        15% { opacity: 0; }
        30% { opacity: 1; }
        60% { opacity: 1; }
        80% { opacity: 0; }
      }
      @keyframes sep-flow-a {
        0%, 100% { opacity: 0; }
        10% { opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        90% { opacity: 0; }
      }
      #var-a { animation: breathe-bg-a 10s ease-in-out 0s infinite; }
      #var-a-particles > * { animation: float-pA calc(3s + var(--i) * 0.4s) ease-in-out 0s infinite; }
      #var-a-halo { animation: pulse-photo-a 10s ease-in-out 0s infinite; }
      #var-a-shimmer { animation: shimmer-name-a 10s ease-in-out 0s infinite; }
      #var-a-sep { animation: sep-flow-a 10s ease-in-out 0s infinite; }

      /* === VARIATION B: Chromatic Wave === */
      @keyframes breathe-bg-b {
        0%, 100% { opacity: 0; }
        10% { opacity: 0.45499999999999996; }
        90% { opacity: 0.45499999999999996; }
      }
      @keyframes wave-b {
        0%, 100% { transform: translateX(-600px); opacity: 0; }
        5% { opacity: 0; }
        10% { opacity: 0.39; }
        50% { transform: translateX(0px); opacity: 0.39; }
        90% { opacity: 0.39; }
        95% { opacity: 0; }
      }
      @keyframes wave-b2 {
        0%, 100% { transform: translateX(600px); opacity: 0; }
        5% { opacity: 0; }
        15% { opacity: 0.26; }
        50% { transform: translateX(0px); }
        85% { opacity: 0.26; }
        95% { opacity: 0; }
      }
      @keyframes hue-logo-b {
        0%, 100% { opacity: 0; }
        10% { opacity: 0; }
        20%, 80% { opacity: 0.65; }
        90% { opacity: 0; }
      }
      @keyframes sep-pulse-b {
        0%, 100% { opacity: 0; transform: scaleY(0.8); }
        15%, 85% { opacity: 0.8; transform: scaleY(1); }
      }
      #var-b { animation: breathe-bg-b 10s ease-in-out 0s infinite; }
      #var-b-wave1 { animation: wave-b 10s ease-in-out 0s infinite; }
      #var-b-wave2 { animation: wave-b2 10s ease-in-out 0s infinite; }
      #var-b-logo-glow { animation: hue-logo-b 10s ease-in-out 0s infinite; }
      #var-b-sep { animation: sep-pulse-b 10s ease-in-out 0s infinite; transform-origin: 172px 90px; }

      /* === VARIATION C: Generative Noise === */
      @keyframes breathe-bg-c {
        0%, 100% { opacity: 0; }
        10% { opacity: 0.39; }
        90% { opacity: 0.39; }
      }
      @keyframes noise-pC {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 0.52; }
        33% { transform: translateY(-12px) scale(1.1); }
        66% { transform: translateY(8px) scale(0.9); }
        90% { opacity: 0; }
      }
      @keyframes ring-expand-c {
        0%, 100% { r: 52; opacity: 0; }
        10% { opacity: 0; }
        20%, 80% { r: 58; opacity: 0.39; }
        90% { opacity: 0; }
      }
      @keyframes text-shimmer-c {
        0%, 100% { opacity: 0; }
        15% { opacity: 0; }
        25%, 75% { opacity: 1; }
        85% { opacity: 0; }
      }
      @keyframes sep-noise-c {
        0%, 100% { opacity: 0; }
        10%, 90% { opacity: 0.6; }
      }
      #var-c { animation: breathe-bg-c 10s ease-in-out 0s infinite; }
      #var-c-particles > * { animation: noise-pC calc(2.5s + var(--i) * 0.3s) ease-in-out 0s infinite; }
      #var-c-ring { animation: ring-expand-c 10s ease-in-out 0s infinite; }
      #var-c-shimmer { animation: text-shimmer-c 10s ease-in-out 0s infinite; }
      #var-c-sep { animation: sep-noise-c 10s ease-in-out 0s infinite; }

      /* === VARIATION D: Luminous Respiration === */
      @keyframes breathe-bg-d {
        0%, 100% { opacity: 0; }
        10% { opacity: 0.5850000000000001; }
        90% { opacity: 0.5850000000000001; }
      }
      @keyframes resp-outer-d {
        0%, 100% { r: 58; opacity: 0; }
        10% { opacity: 0; }
        20% { r: 64; opacity: 0.26; }
        50% { r: 58; opacity: 0.13; }
        80% { r: 64; opacity: 0.26; }
        90% { opacity: 0; }
      }
      @keyframes resp-inner-d {
        0%, 100% { r: 52; opacity: 0; }
        10% { opacity: 0; }
        20%, 80% { r: 54; opacity: 0.45499999999999996; }
        50% { r: 52; opacity: 0.325; }
        90% { opacity: 0; }
      }
      @keyframes cta-glow-d {
        0%, 100% { opacity: 0; }
        15%, 85% { opacity: 0.5; }
        50% { opacity: 0.8; }
      }
      @keyframes sep-resp-d {
        0%, 100% { opacity: 0; }
        15% { opacity: 0.3; }
        50% { opacity: 1; }
        85% { opacity: 0.3; }
      }
      @keyframes logo-rotate-d {
        0%, 100% { opacity: 0; transform: rotate(0deg); }
        10% { opacity: 0.195; }
        50% { transform: rotate(6deg); }
        90% { opacity: 0; }
      }
      #var-d { animation: breathe-bg-d 10s ease-in-out 0s infinite; }
      #var-d-outer { animation: resp-outer-d 10s ease-in-out 0s infinite; }
      #var-d-inner { animation: resp-inner-d 10s ease-in-out 0s infinite; }
      #var-d-cta { animation: cta-glow-d 10s ease-in-out 0s infinite; }
      #var-d-sep { animation: sep-resp-d 10s ease-in-out 0s infinite; }
      #var-d-logo { animation: logo-rotate-d 10s ease-in-out 0s infinite; transform-origin: 76px 135px; }


      /* Variation layer visibility orchestration */
      #layer-var-a, #layer-var-b, #layer-var-c, #layer-var-d {
        opacity: 0;
        will-change: opacity;
      }

      /* ================================================================
         TIMING ORCHESTRATION — 80s cycle | CROSSFADE CONTINU (no gap)
         Principe : chaque variation se CHEVAUCHE avec la suivante.
         A s'éteint pendant que B s'allume → zéro zone morte.
         Chaque variation visible ~20s | Transition crossfade 2s
         ================================================================ */

      /* Cycle 80s : A→B→C→D→A en boucle parfaite sans blanc */
      #layer-var-a { animation: layer-fade-a 80s cubic-bezier(0.4,0,0.2,1) 0s infinite; }
      #layer-var-b { animation: layer-fade-b 80s cubic-bezier(0.4,0,0.2,1) 0s infinite; }
      #layer-var-c { animation: layer-fade-c 80s cubic-bezier(0.4,0,0.2,1) 0s infinite; }
      #layer-var-d { animation: layer-fade-d 80s cubic-bezier(0.4,0,0.2,1) 0s infinite; }

      /* A : 0%→2.5% montée | 2.5%→22.5% présent | 22.5%→25% descente  */
      @keyframes layer-fade-a {
        0%      { opacity: 0; }
        2.5%    { opacity: 1; }
        22.5%   { opacity: 1; }
        25%     { opacity: 0; }
        98%     { opacity: 0; }
        100%    { opacity: 0; }
      }

      /* B : 22.5%→25% montée (chevauche la descente de A) | 25%→47.5% présent | 47.5%→50% descente */
      @keyframes layer-fade-b {
        0%      { opacity: 0; }
        22.5%   { opacity: 0; }
        25%     { opacity: 1; }
        47.5%   { opacity: 1; }
        50%     { opacity: 0; }
        100%    { opacity: 0; }
      }

      /* C : 47.5%→50% montée | 50%→72.5% présent | 72.5%→75% descente */
      @keyframes layer-fade-c {
        0%      { opacity: 0; }
        47.5%   { opacity: 0; }
        50%     { opacity: 1; }
        72.5%   { opacity: 1; }
        75%     { opacity: 0; }
        100%    { opacity: 0; }
      }

      /* D : 72.5%→75% montée | 75%→97.5% présent | 97.5%→100% descente → retour à A */
      @keyframes layer-fade-d {
        0%      { opacity: 0; }
        72.5%   { opacity: 0; }
        75%     { opacity: 1; }
        97.5%   { opacity: 1; }
        100%    { opacity: 0; }
      }

      /* Couche de base — toujours visible, fond de scène permanent */
      #layer-base { opacity: 1; }
      #bg-base    { opacity: 1; }

      /* Respiration légère sur le fond : la signature est vivante même au repos */
      @keyframes sig-base-breathe {
        0%, 100% { filter: brightness(1);   }
        50%      { filter: brightness(1.04); }
      }
      #layer-base {
        animation: sig-base-breathe 14s ease-in-out 0s infinite;
      }

      /* Internal variation animations timing */
      #var-a, #var-a-halo, #var-a-shimmer, #var-a-sep {
        animation-duration: 10s;
        animation-iteration-count: infinite;
      }
      #var-b, #var-b-wave1, #var-b-wave2, #var-b-logo-glow, #var-b-sep {
        animation-duration: 10s;
        animation-iteration-count: infinite;
      }
      #var-c, #var-c-ring, #var-c-shimmer, #var-c-sep {
        animation-duration: 10s;
        animation-iteration-count: infinite;
      }
      #var-d, #var-d-outer, #var-d-inner, #var-d-cta, #var-d-sep, #var-d-logo {
        animation-duration: 10s;
        animation-iteration-count: infinite;
      }

    </style>
  </defs>

  <!-- ===== LAYER 0: Static Background ===== -->
  <rect id="bg-root" x="0" y="0" width="600" height="180" fill="#0d0d1a" rx="12"/>

  <!-- ===== LAYER 1: Static Base — Always Visible ===== -->
  <!-- Logo statique masqué par CSS ; chaque variation en fournit une copie animée -->
  <g id="layer-base">
    <g id="base-static">
  <!-- Background base -->
  <rect id="bg-base" x="0" y="0" width="600" height="180" fill="#0d0d1a" rx="12"/>

  <!-- Left column: photo + logo -->
  <g id="left-col" transform="translate(16, 16)">
    <circle cx="60" cy="60" r="52" fill="#c9a84c" fill-opacity="0.15" stroke="#c9a84c" stroke-width="2" id="photo-ring"/>
  <text x="60" y="67" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">SL</text>
    <rect x="10" y="122" width="120" height="26" rx="4" fill="#c9a84c" fill-opacity="0.15" id="logo-bg"/>
  <text x="70" y="139" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#c9a84c" letter-spacing="1" id="company-logo-text">LUMIÈRE STUD</text>
  </g>

  <!-- Separator vertical -->
  <g id="separator-v" transform="translate(170, 16)">
    <defs>
    <linearGradient id="sep-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#c9a84c" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="rgb(241,208,116)" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="rgb(241,208,116)" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect id="sep-bar" x="0" y="0" width="2" height="148" fill="url(#sep-grad)" rx="1"/>
  </g>

  <!-- Right column: info -->
  <g id="right-col" transform="translate(186, 20)">
    <!-- Name -->
    <text id="sig-name" x="0" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.5">Sophie Laurent</text>

    <!-- Title -->
    <text id="sig-titre" x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#c9a84c" letter-spacing="1.5" text-transform="uppercase">DIRECTRICE CRÉATIVE</text>

    <!-- Company -->
    <text id="sig-company" x="0" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)">Lumière Studio</text>

    <!-- Separator horizontal thin -->
    <line x1="0" y1="64" x2="380" y2="64" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Contact info -->
    <g id="contact-block" transform="translate(0, 72)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">✉  <tspan fill="#ffffff">sophie@lumiere-studio.fr</tspan></text>
      
      
    </g>

    <!-- Social icons -->
    <g id="social-icons" transform="translate(0, 120)">
      
    </g>

    <!-- CTA -->
    <g id="cta-block" transform="translate(220, 110)">
      
    </g>
  </g>
</g>
  </g>

  <!-- ===== LAYER 2: Variation A — Breathing Particles ===== -->
  <g id="layer-var-a">
    <g id="var-a">
      <!-- Subtle background wash -->
      <rect x="0" y="0" width="600" height="180" fill="url(#grad-bg-a)" rx="12"/>
      <!-- Floating particles -->
      <g id="var-a-particles"><rect x="426" y="128" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:0"/>
        <rect x="137" y="129" width="6" height="6" rx="3" fill="#c9a84c" fill-opacity="0.5" style="--i:1"/>
        <rect x="407" y="97" width="10" height="10" rx="5" fill="#c9a84c" fill-opacity="0.5" style="--i:2"/>
        <rect x="85" y="3" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:3"/>
        <rect x="455" y="15" width="2" height="2" rx="1" fill="#c9a84c" fill-opacity="0.5" style="--i:4"/>
        <rect x="88" y="2" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:5"/>
        <rect x="382" y="138" width="4" height="4" rx="2" fill="#c9a84c" fill-opacity="0.5" style="--i:6"/>
        <rect x="226" y="48" width="6" height="6" rx="3" fill="#c9a84c" fill-opacity="0.5" style="--i:7"/>
        <rect x="210" y="3" width="6" height="6" rx="3" fill="#c9a84c" fill-opacity="0.5" style="--i:8"/>
        <rect x="376" y="4" width="10" height="10" rx="5" fill="#c9a84c" fill-opacity="0.5" style="--i:9"/>
        <rect x="160" y="97" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:10"/>
        <rect x="227" y="129" width="4" height="4" rx="2" fill="#c9a84c" fill-opacity="0.5" style="--i:11"/>
        <rect x="29" y="7" width="4" height="4" rx="2" fill="#c9a84c" fill-opacity="0.5" style="--i:12"/>
        <rect x="500" y="156" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:13"/>
        <rect x="371" y="117" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:14"/>
        <rect x="568" y="31" width="4" height="4" rx="2" fill="#c9a84c" fill-opacity="0.5" style="--i:15"/>
        <rect x="81" y="85" width="4" height="4" rx="2" fill="#c9a84c" fill-opacity="0.5" style="--i:16"/>
        <rect x="277" y="139" width="8" height="8" rx="4" fill="#c9a84c" fill-opacity="0.5" style="--i:17"/>
        <rect x="567" y="113" width="10" height="10" rx="5" fill="#c9a84c" fill-opacity="0.5" style="--i:18"/>
        <rect x="569" y="30" width="6" height="6" rx="3" fill="#c9a84c" fill-opacity="0.5" style="--i:19"/></g>
      <!-- Photo halo -->
      <circle id="var-a-halo" cx="76" cy="76" r="58" fill="url(#grad-halo)"/>
      <!-- Name shimmer bar -->
      <rect id="var-a-shimmer" x="186" y="12" width="200" height="24" fill="url(#grad-shimmer)" rx="4"/>
      <!-- Separator glow -->
      <rect id="var-a-sep" x="170" y="16" width="4" height="148" fill="url(#grad-sep-flow)" rx="2"/>
    </g>
  </g>

  <!-- ===== LAYER 3: Variation B — Chromatic Wave ===== -->
  <g id="layer-var-b">
    <g id="var-b">
      <rect x="0" y="0" width="600" height="180" fill="#c9a84c" fill-opacity="0.05" rx="12"/>
      <rect id="var-b-wave1" x="-600" y="0" width="600" height="180" fill="url(#grad-bg-b)" rx="12"/>
      <rect id="var-b-wave2" x="0" y="0" width="600" height="180" fill="#f0e6c8" fill-opacity="0.08" rx="12"/>
      <ellipse id="var-b-logo-glow" cx="70" cy="135" rx="55" ry="18" fill="#c9a84c" fill-opacity="0.2"/>
      <rect id="var-b-sep" x="170" y="16" width="4" height="148" fill="#c9a84c" fill-opacity="0.5" rx="2"/>
    </g>
  </g>

  <!-- ===== LAYER 4: Variation C — Generative Noise ===== -->
  <g id="layer-var-c">
    <g id="var-c">
      <rect x="0" y="0" width="600" height="180" fill="#0d0d1a" fill-opacity="0.3" rx="12"/>
      <g id="var-c-particles"><circle cx="426" cy="128" r="4" fill="#f0e6c8" fill-opacity="0.6" style="--i:0" />
        <circle cx="137" cy="129" r="3" fill="#f0e6c8" fill-opacity="0.6" style="--i:1" />
        <circle cx="407" cy="97" r="5" fill="#f0e6c8" fill-opacity="0.6" style="--i:2" />
        <circle cx="85" cy="3" r="4" fill="#f0e6c8" fill-opacity="0.6" style="--i:3" />
        <circle cx="455" cy="15" r="1" fill="#f0e6c8" fill-opacity="0.6" style="--i:4" />
        <circle cx="88" cy="2" r="4" fill="#f0e6c8" fill-opacity="0.6" style="--i:5" />
        <circle cx="382" cy="138" r="2" fill="#f0e6c8" fill-opacity="0.6" style="--i:6" />
        <circle cx="226" cy="48" r="3" fill="#f0e6c8" fill-opacity="0.6" style="--i:7" />
        <circle cx="210" cy="3" r="3" fill="#f0e6c8" fill-opacity="0.6" style="--i:8" />
        <circle cx="376" cy="4" r="5" fill="#f0e6c8" fill-opacity="0.6" style="--i:9" />
        <circle cx="160" cy="97" r="4" fill="#f0e6c8" fill-opacity="0.6" style="--i:10" />
        <circle cx="227" cy="129" r="2" fill="#f0e6c8" fill-opacity="0.6" style="--i:11" /></g>
